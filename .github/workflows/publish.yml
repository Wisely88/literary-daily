name: Publish literary daily

on:
  schedule:
    - cron: "30 8,12,18,22 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      category:
        description: "Optional category or category key"
        required: false
        default: ""
        type: string
      force:
        description: "Ignore history cooldowns"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Evaluate and print without writing or deploying"
        required: false
        default: false
        type: boolean
      skip_tts:
        description: "Publish without attempting Gemini TTS"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: literary-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m compileall -q src scripts
          python -m unittest discover -s tests -v

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_TTS: ${{ inputs.skip_tts }}
        run: |
          args=()
          if [ -n "$INPUT_CATEGORY" ]; then
            args+=(--category "$INPUT_CATEGORY")
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$INPUT_SKIP_TTS" = "true" ]; then
            args+=(--skip-tts)
          fi
          python -m src.main "${args[@]}"

      - name: Commit generated data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          git config user.name "literary-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: publish literary selection"
            git push
          fi

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify after successful deployment
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python scripts/notify.py
